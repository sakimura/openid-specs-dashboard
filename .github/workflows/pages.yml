name: Crawl specs and deploy dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write   # commit the updated source-fixes report
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keep downloaded spec HTML between runs so only changed files are fetched.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: specs-cache-${{ github.run_id }}
          restore-keys: specs-cache-

      - name: Test parser
        run: python -m unittest discover -s crawler

      - name: Crawl openid.net/specs
        run: python crawler/build_data.py

      - name: Commit source-fixes report if it changed
        run: |
          if git diff --quiet -I '^Generated ' -- reports/; then
            echo "Report unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/source-fixes.md
          git commit -m "Update source-fixes report"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
